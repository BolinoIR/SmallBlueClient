[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SmallBlueClient"
version = "0.4.3"
description = "Community BigBlueButton automation client"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SmallBlueClient community"}]
dependencies = ["websocket-client>=1.7", "livekit>=1.1,<2", "av>=14,<18", "aiortc>=1.15,<2", "websockets>=13,<14", "Pillow>=10,<12", "numpy>=1.24", "arabic-reshaper>=3,<4", "python-bidi>=0.6,<1"]

[project.optional-dependencies]
docs = ["sphinx>=8,<9", "furo>=2024.8.6", "myst-parser>=4,<5", "linkify-it-py>=2,<3"]
transcription = ["faster-whisper>=1.1,<2"]
dev = ["ruff>=0.12", "mypy>=1.13", "pre-commit>=4", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/BolinoIR/SmallBlueClient/"
Documentation = "https://sbc.protobuf.lol"

[project.scripts]
sbc = "sbc.cli:main"

[tool.setuptools.packages.find]
include = ["sbc*"]

[tool.setuptools.package-data]
sbc = ["py.typed", "*.md"]
"sbc.operations" = ["*.pyi"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "release", "docs/_build", "archive", "bigbluebutton-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E703", "E731"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
