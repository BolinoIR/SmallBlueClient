name: Test SmallBlueClient

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SBC and test tooling
        run: python -m pip install --upgrade pip build twine sphinx furo myst-parser .
      - name: Run full unit suite
        run: python -m unittest discover -s tests -q
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify wheel installation outside checkout
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          $GITHUB_WORKSPACE/wheel-test/bin/python -c "import sbc; assert sbc.__version__"

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build warning-free documentation
        run: |
          python -m pip install --upgrade pip sphinx furo myst-parser .
          python -m sphinx -W -b html docs docs/_build/html
